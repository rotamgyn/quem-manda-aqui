[project]
name = "quem-manda-aqui"
version = "0.1.0"
description = "Quem Manda Aqui: dados de política brasileira"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "httpx",
    "truststore>=0.10.4",
    "tzdata",
    "boto3>=1.43.114",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "dados-comuns/src/qma_comum",
    "modulos/eleicoes-2026/pipeline/src/qma_eleicoes",
]

[tool.pytest.ini_options]
testpaths = ["dados-comuns/testes", "modulos/eleicoes-2026/pipeline/testes"]
addopts = "-m 'not rede'"
markers = ["rede: testes que acessam a internet"]
